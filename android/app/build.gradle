plugins { id 'com.android.application' }

// URL da API e Client ID do Google podem ser definidos em ~/.gradle/gradle.properties ou com -P.
def apiDebug = project.findProperty('lavicameta.apiBaseUrl.debug') ?: 'http://10.0.2.2:8080/api/v1/'
def apiRelease = project.findProperty('lavicameta.apiBaseUrl.release') ?: 'https://api.lavcameta.invalid/api/v1/'
def googleClientId = project.findProperty('lavicameta.googleWebClientId') ?: ''

android {
    namespace 'br.com.lavicameta'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.lavicameta'
        minSdk 31
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', "\"${googleClientId}\""
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', "\"${apiDebug}\""
            manifestPlaceholders = [cleartextConfig: '@xml/network_security_debug']
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'API_BASE_URL', "\"${apiRelease}\""
            manifestPlaceholders = [cleartextConfig: '@xml/network_security_release']
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.3'
    // Comunicação com a API REST (prevista no prompt do projeto).
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // QR Code do PIX gerado localmente a partir do código copia e cola (RF10).
    implementation 'com.google.zxing:core:3.5.3'
    // Abertura do checkout do gateway em Custom Tab (o app nunca recebe dados de cartão).
    implementation 'androidx.browser:browser:1.8.0'
    // Login com Google (RF03) via Credential Manager.
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
